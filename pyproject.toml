[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextkit"
version = "0.1.0"
description = "Memory-augmented context management for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "chromadb>=0.4",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
